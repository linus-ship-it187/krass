<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willkommen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    color: #ccc; cursor: pointer; text-align: center; padding: 24px;
  }
  #start h1 { font-weight: 300; margin: 0; font-size: 1.6rem; }
  #start p { margin: 0; opacity: .6; font-size: .95rem; }
  #scare { position: fixed; inset: 0; display: none; background: #000; }
  #scare.on { display: block; animation: shake .06s infinite, flash .12s infinite; }
  #scare svg, #scare img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #face { animation: zoom 2.5s ease-in forwards; transform-origin: 50% 40%; }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.6); } }
  @keyframes shake {
    0% { transform: translate(6px, 4px); } 25% { transform: translate(-7px, -5px); }
    50% { transform: translate(5px, -6px); } 75% { transform: translate(-6px, 6px); }
    100% { transform: translate(4px, -4px); }
  }
  @keyframes flash { 0%, 100% { filter: none; } 50% { filter: invert(1) contrast(1.4); } }
</style>
</head>
<body>

<div id="start">
  <h1>Klicke irgendwo, um fortzufahren</h1>
  <p>(Ton an für das beste Erlebnis)</p>
</div>

<div id="scare">
  <!-- Eigenes Bild? Siehe CONFIG unten. Standard: gezeichnetes Gruselgesicht -->
  <div id="face">
    <svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg" cx="50%" cy="45%" r="70%">
          <stop offset="0" stop-color="#5a0000"/><stop offset="1" stop-color="#000"/>
        </radialGradient>
        <radialGradient id="skin" cx="50%" cy="40%" r="65%">
          <stop offset="0" stop-color="#d9d4c4"/><stop offset="1" stop-color="#6e6a5c"/>
        </radialGradient>
      </defs>
      <rect width="400" height="500" fill="url(#bg)"/>
      <ellipse cx="200" cy="250" rx="125" ry="185" fill="url(#skin)"/>
      <!-- Augenhöhlen -->
      <ellipse cx="148" cy="205" rx="42" ry="58" fill="#000" transform="rotate(-8 148 205)"/>
      <ellipse cx="252" cy="205" rx="42" ry="58" fill="#000" transform="rotate(8 252 205)"/>
      <circle cx="148" cy="212" r="9" fill="#fff"/>
      <circle cx="252" cy="212" r="9" fill="#fff"/>
      <!-- Nase -->
      <path d="M200 255 L186 315 L214 315 Z" fill="#2a2620" opacity=".75"/>
      <!-- Schreiender Mund -->
      <ellipse cx="200" cy="395" rx="62" ry="78" fill="#000"/>
      <path d="M150 350 L162 378 L174 350 L188 382 L200 350 L212 382 L226 350 L238 378 L250 350" fill="#e8e4d4"/>
      <path d="M156 440 L168 418 L180 442 L200 418 L220 442 L232 418 L244 440" fill="#e8e4d4"/>
      <!-- Risse -->
      <path d="M110 140 L150 175 L135 215 M290 135 L255 180 L270 225" stroke="#2a2620" stroke-width="3" fill="none" opacity=".6"/>
    </svg>
  </div>
</div>

<script>
/* ================= CONFIG =================
   Eigenes Bild / eigener Sound? Datei ins Repo legen und hier eintragen,
   z. B. IMAGE_URL = "scary.jpg";  SOUND_URL = "scream.mp3";
   Leer lassen = eingebautes Gesicht + synthetischer Schrei.
============================================ */
const IMAGE_URL = "";
const SOUND_URL = "";
const DURATION_MS = 4000;      // wie lange der Schreck dauert
const REDIRECT_URL = "";       // optional: danach weiterleiten, z. B. "https://github.com"

const start = document.getElementById("start");
const scare = document.getElementById("scare");
const face  = document.getElementById("face");

if (IMAGE_URL) {
  face.innerHTML = '<img src="' + IMAGE_URL + '" alt="">';
}

function synthScream(ctx) {
  const t = ctx.currentTime, dur = 3;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, t);
  master.gain.exponentialRampToValueAtTime(1, t + 0.03);
  master.gain.setValueAtTime(1, t + dur - 0.8);
  master.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  // Verzerrung
  const shaper = ctx.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) {
    const x = i / 512 - 1;
    curve[i] = Math.tanh(x * 6);
  }
  shaper.curve = curve;

  const comp = ctx.createDynamicsCompressor();
  shaper.connect(master); master.connect(comp); comp.connect(ctx.destination);

  // Tonhöhe des Schreis
  const base = ctx.createConstantSource();
  base.offset.setValueAtTime(500, t);
  base.offset.exponentialRampToValueAtTime(1500, t + 0.35);
  base.offset.linearRampToValueAtTime(1100, t + dur);

  // Vibrato
  const lfo = ctx.createOscillator(); lfo.frequency.value = 9;
  const lfoGain = ctx.createGain(); lfoGain.gain.value = 70;
  lfo.connect(lfoGain);

  [1, 1.505, 2.01].forEach((mult, i) => {
    const o = ctx.createOscillator();
    o.type = i === 1 ? "square" : "sawtooth";
    o.frequency.value = 0;
    const m = ctx.createGain(); m.gain.value = mult;
    base.connect(m); m.connect(o.frequency);
    lfoGain.connect(o.frequency);
    const g = ctx.createGain(); g.gain.value = 0.28 / (i + 1);
    o.connect(g); g.connect(shaper);
    o.start(t); o.stop(t + dur);
  });

  // Rauschen (heiser)
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource(); noise.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2500; bp.Q.value = 0.8;
  const ng = ctx.createGain(); ng.gain.value = 0.5;
  noise.connect(bp); bp.connect(ng); ng.connect(shaper);

  base.start(t); lfo.start(t); noise.start(t);
  base.stop(t + dur); lfo.stop(t + dur);
}

let fired = false;
function fire() {
  if (fired) return; fired = true;
  start.style.display = "none";
  scare.classList.add("on");

  try {
    if (SOUND_URL) {
      const a = new Audio(SOUND_URL); a.volume = 1; a.play();
    } else {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume().then(() => synthScream(ctx));
    }
  } catch (e) { console.error(e); }

  if (navigator.vibrate) navigator.vibrate([200, 80, 200, 80, 400]);
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }

  setTimeout(() => {
    if (REDIRECT_URL) { location.href = REDIRECT_URL; }
  }, DURATION_MS);
}

["click", "touchstart", "keydown"].forEach(ev =>
  document.addEventListener(ev, fire, { once: true })
);
</script>
</body>
</html>
